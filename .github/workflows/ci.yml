name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Basic compilation check ───────────────────────────────────────────
  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check

  # ── Test suite (unit + integration + doc-tests) ───────────────────────
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: >
          cargo test --lib --tests --
          --skip mpmc_stress
          --skip stress_1m
          --skip arbitrary_capacity_mpmc_stress
          --skip arbitrary_capacity_stress
        timeout-minutes: 5
      - run: cargo test --doc
      - run: >
          cargo test --workspace --all-features --
          --skip mpmc_stress
          --skip stress_1m
          --skip bounded_cross_thread
          --skip mpmc_two_publishers
        timeout-minutes: 5

  # ── Lint with Clippy ──────────────────────────────────────────────────
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --all-features -- -D warnings

  # ── Formatting check ─────────────────────────────────────────────────
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ── MSRV verification ─────────────────────────────────────────────
  msrv:
    name: MSRV 1.94
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - run: cargo check

  # ── Miri (undefined-behavior detector) ────────────────────────────────
  miri:
    name: miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      # This is the gate behind the crate's soundness claim. The default build
      # is data-race-free, so the multi-threaded tests that previously had to be
      # skipped now run and must be completely clean. Only the long stress tests
      # are excluded, because Miri interprets rather than executes. Iteration
      # counts scale themselves down under cfg(miri); see tests/atomic_slots.rs.
      - run: >
          cargo +nightly miri test
          --test correctness --test atomic_slots --test atomic_slots_payload_sizes --
          --skip stress_1m
          --skip mpmc_stress
          --skip arbitrary_capacity_stress
        timeout-minutes: 30

  # ── Doc links and doc warnings ───────────────────────────────────────
  #
  # Intra-doc links rot silently: they break on a rename and nothing fails.
  # 18 were broken before this gate existed.
  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --all-features --no-deps

  # ── Loom: exhaustive interleaving checks on the concurrency protocols ──
  #
  # These models encode the MPMC cursor protocol and the bounded-channel
  # backpressure guarantee. They are the gate for invariants that reading the
  # code is not sufficient to establish: the registration race fixed in
  # `register_tracker_at_head` survived review, and is caught here mechanically.
  loom:
    name: loom
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --cfg loom
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --test loom_mpmc --test loom_backpressure
        timeout-minutes: 20

  # ── Cross-platform matrix build ──────────────────────────────────────
  cross-platform:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check
      - run: >
          cargo test --lib --tests --
          --skip mpmc_stress
          --skip stress_1m
          --skip arbitrary_capacity_mpmc_stress
          --skip arbitrary_capacity_stress
        timeout-minutes: 5

  # ── WASM build (verify no_std / WASM compatibility) ──────────────────
  wasm:
    name: wasm32 check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --target wasm32-unknown-unknown

  # ── Hugepages feature gate (Linux only) ──────────────────────────────
  hugepages:
    name: hugepages feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --features hugepages

  # ── Volatile slots (opt-out of the default, still supported) ─────────
  #
  # `default-features = false` selects the older volatile implementation. It is
  # a formal data race under the Rust memory model, so Miri is not run against
  # it, but it must keep building and passing its tests.
  volatile-slots:
    name: volatile slots (no default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --no-default-features
      - run: >
          cargo test --no-default-features --lib --tests --
          --skip mpmc_stress
          --skip stress_1m
          --skip arbitrary_capacity_mpmc_stress
          --skip arbitrary_capacity_stress
        timeout-minutes: 5

  # ── photon-ring-async tests ────────────────────────────────────────
  async-crate:
    name: photon-ring-async
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p photon-ring-async

  # ── photon-ring-metrics tests ──────────────────────────────────────
  metrics-crate:
    name: photon-ring-metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p photon-ring-metrics

  # ── Publish to crates.io (only on tagged releases) ───────────────────
  publish:
    name: publish
    needs: [check, test, clippy, fmt, docs, miri, loom, cross-platform, wasm, hugepages, volatile-slots, async-crate, metrics-crate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # Idempotent re-runs: tolerate an already-published version, but fail
        # on any other error instead of masking it with `|| true`.
        run: |
          set -euo pipefail
          publish() {
            local out
            if out=$(cargo publish "$@" --token "$CARGO_REGISTRY_TOKEN" 2>&1); then
              echo "$out"
            elif echo "$out" | grep -qiE 'already (exists|uploaded)'; then
              echo "$out"
              echo "==> already published, skipping"
            else
              echo "$out"
              return 1
            fi
          }
          # Order: derive → core → async + metrics; pause for index propagation.
          publish -p photon-ring-derive
          sleep 30
          publish
          sleep 30
          publish -p photon-ring-async
          publish -p photon-ring-metrics
